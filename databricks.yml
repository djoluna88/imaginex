bundle:
  name: nba-players-pipeline

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog name. Created by the setup task if missing.
    default: imaginex
  schema:
    default: nba
  raw_dir:
    default: /Volumes/${var.catalog}/${var.schema}/source_data
  output_dir:
    default: /Volumes/${var.catalog}/${var.schema}/output_files

targets:
  dev:
    default: true
    mode: development
    presets:
      name_prefix: ""