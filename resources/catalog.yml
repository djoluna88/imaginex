resources:
  schemas:
    bronze:
      catalog_name: ${var.catalog}
      name: nba_bronze
    silver:
      catalog_name: ${var.catalog}
      name: nba_silver
    gold:
      catalog_name: ${var.catalog}
      name: nba_gold

  volumes:
    raw:
      catalog_name: ${var.catalog}
      schema_name: ${resources.schemas.bronze.name}
      name: raw                  #Ingest the  CSV from Kaggle and its snapshots
    output:
      catalog_name: ${var.catalog}
      schema_name: ${resources.schemas.gold.name}
      name: output               # Ingest the JSON and PNG